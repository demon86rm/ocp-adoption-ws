# applicationset-platform-secrets.yaml
# Purpose: platform component delivered to every tagged cluster: the ClusterSecretStore and its reader.
# Uses the default project because it creates cluster-scoped objects. In a real fleet give it a platform-only project.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-secrets
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: gitops-agent-workshop
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: env
              operator: Exists
  template:
    metadata:
      name: 'platform-secrets-{{.name}}'
      labels:
        app.kubernetes.io/part-of: gitops-agent-workshop
    spec:
      project: default
      source:
        repoURL: https://github.com/demon86rm/ocp-gitops-fleet-sample
        targetRevision: HEAD
        path: platform/secret-store
      destination:
        name: '{{.name}}'
        namespace: workshop-secrets-source
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            argocd.argoproj.io/managed-by: '{{ index .metadata.labels "gitops-instance" }}'
        syncOptions:
          - CreateNamespace=true
