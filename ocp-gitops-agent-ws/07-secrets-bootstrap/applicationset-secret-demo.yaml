# applicationset-secret-demo.yaml
# Purpose: the demo app that reads its token through the ClusterSecretStore. The token is not in Git.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: secret-demo
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: gitops-agent-workshop
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: env
              operator: Exists
  template:
    metadata:
      name: 'secret-demo-{{.name}}'
      labels:
        app.kubernetes.io/part-of: gitops-agent-workshop
    spec:
      project: 'env-{{ index .metadata.labels "env" }}'
      source:
        repoURL: https://github.com/demon86rm/ocp-gitops-fleet-sample
        targetRevision: HEAD
        path: apps/secret-demo
      destination:
        name: '{{.name}}'
        namespace: fleet-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            argocd.argoproj.io/managed-by: '{{ index .metadata.labels "gitops-instance" }}'
        syncOptions:
          - CreateNamespace=true
