# application-managed.yaml
# Purpose: first Application, created on the hub and delivered to spoke-a (managed mode).
# The Application lives in the hub namespace named after the agent.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-demo-app
  namespace: spoke-a
  labels:
    app.kubernetes.io/part-of: gitops-agent-workshop
spec:
  project: default
  source:
    repoURL: https://github.com/redhat-developer/openshift-gitops-getting-started
    targetRevision: HEAD
    path: app
  destination:
    name: spoke-a
    namespace: my-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: gitops-spoke-a
    syncOptions:
      - CreateNamespace=true
