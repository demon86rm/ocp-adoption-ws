# argocd-agent-patch.yaml
# Purpose: merge patch that enables the Agent in a spoke Argo CD, managed mode, destination-based mapping.
# Contains ${PRINCIPAL_DNS} and ${AGENT_ARGOCD}, so apply it through envsubst (see the page).
spec:
  server:
    enabled: false
  argoCDAgent:
    agent:
      enabled: true
      client:
        keepAliveInterval: 50s
        mode: managed
        principalServerAddress: "${PRINCIPAL_DNS}"
        principalServerPort: "443"
      logLevel: "info"
      creds: "mtls:any"
      redis:
        serverAddress: "${AGENT_ARGOCD}-redis:6379"
      destinationBasedMapping:
        enabled: true
        createNamespace: true
      tls:
        insecure: false
        rootCASecretName: argocd-agent-ca
        secretName: argocd-agent-client-tls
