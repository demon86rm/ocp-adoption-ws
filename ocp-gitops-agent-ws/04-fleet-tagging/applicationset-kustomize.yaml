# applicationset-kustomize.yaml
# Purpose: one ApplicationSet that deploys the sample Kustomize app to every cluster that has an env tag.
# The overlay is chosen by the env tag: overlays/test or overlays/prod.
# Source: the public ocp-gitops-fleet-sample repository.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fleet-kustomize
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: gitops-agent-workshop
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: env
              operator: Exists
  template:
    metadata:
      name: 'fleet-kustomize-{{.name}}'
      labels:
        app.kubernetes.io/part-of: gitops-agent-workshop
    spec:
      project: default
      source:
        repoURL: https://github.com/demon86rm/ocp-gitops-fleet-sample
        targetRevision: HEAD
        path: 'apps/hello/kustomize/overlays/{{ index .metadata.labels "env" }}'
      destination:
        name: '{{.name}}'
        namespace: fleet-kustomize
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            argocd.argoproj.io/managed-by: '{{ index .metadata.labels "gitops-instance" }}'
        syncOptions:
          - CreateNamespace=true
