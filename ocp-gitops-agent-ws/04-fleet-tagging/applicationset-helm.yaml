# applicationset-helm.yaml
# Purpose: one ApplicationSet that deploys the sample Helm chart to every cluster that has an env tag.
# The values file is chosen by the env tag: values-test.yaml or values-prod.yaml.
# Source: the public ocp-gitops-fleet-sample repository.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fleet-helm
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: gitops-agent-workshop
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: env
              operator: Exists
  template:
    metadata:
      name: 'fleet-helm-{{.name}}'
      labels:
        app.kubernetes.io/part-of: gitops-agent-workshop
    spec:
      project: default
      source:
        repoURL: https://github.com/demon86rm/ocp-gitops-fleet-sample
        targetRevision: HEAD
        path: apps/hello/helm
        helm:
          valueFiles:
            - values.yaml
            - 'values-{{ index .metadata.labels "env" }}.yaml'
      destination:
        name: '{{.name}}'
        namespace: fleet-helm
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            argocd.argoproj.io/managed-by: '{{ index .metadata.labels "gitops-instance" }}'
        syncOptions:
          - CreateNamespace=true
