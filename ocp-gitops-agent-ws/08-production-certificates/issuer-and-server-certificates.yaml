# issuer-and-server-certificates.yaml
# Purpose: cert-manager Issuer on the Principal CA, and the two server certificates the Principal needs.
# Contains ${PRINCIPAL_DNS}, so apply it through envsubst. The Principal route host must be the first DNS name.
# duration and renewBefore are suggested values, not values from the Red Hat page.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: argocd-agent-ca
  namespace: openshift-gitops
spec:
  ca:
    secretName: argocd-agent-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-agent-principal-tls
  namespace: openshift-gitops
spec:
  secretName: argocd-agent-principal-tls
  commonName: principal
  dnsNames:
    - ${PRINCIPAL_DNS}
    - openshift-gitops-agent-principal.openshift-gitops.svc.cluster.local
  usages: [server auth, digital signature, key encipherment]
  duration: 2160h
  renewBefore: 720h
  privateKey: {algorithm: RSA, size: 4096}
  issuerRef: {name: argocd-agent-ca, kind: Issuer}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-agent-resource-proxy-tls
  namespace: openshift-gitops
spec:
  secretName: argocd-agent-resource-proxy-tls
  commonName: resource-proxy
  dnsNames:
    - openshift-gitops-agent-principal-resource-proxy
    - openshift-gitops-agent-principal-resource-proxy.openshift-gitops.svc.cluster.local
  usages: [server auth, client auth, digital signature, key encipherment]
  duration: 2160h
  renewBefore: 720h
  privateKey: {algorithm: RSA, size: 4096}
  issuerRef: {name: argocd-agent-ca, kind: Issuer}
