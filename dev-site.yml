runtime:
  cache_dir: ./.cache/antora

site:
  title: "OpenShift Adoption Workshops (Dev Mode)"
  url: http://localhost:3000
  start_page: ocp-gitops-agent::index.adoc

content:
  sources:
    - url: .
      branches: HEAD
      start_path: ocp-gitops-agent-ws/documentation
asciidoc:
  attributes:
    title: "OpenShift Adoption Workshops (Dev Mode)"
  extensions:
    - ./lib/remote-include-processor.js
    - ./lib/tab-block.js
ui:
  bundle:
    url: https://github.com/redhat-developer-demos/rhd-tutorial-ui/releases/download/v0.1.10/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui
output:
  dir: ./gh-pages
