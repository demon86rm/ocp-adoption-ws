runtime:
  cache_dir: ./.cache/antora

site:
  title: "OpenShift Adoption Workshops"
  url: https://demon86rm.github.io/ocp-adoption-ws
  start_page: ocp-gitops-agent::index.adoc

content:
  sources:
    # One entry per workshop folder. Add the next workshop here.
    - url: ./
      branches: HEAD
      start_path: ocp-gitops-agent-ws/documentation

asciidoc:
  attributes:
    release-version: master
    page-pagination: true
  extensions:
    - ./lib/tab-block.js
    - ./lib/remote-include-processor.js

ui:
  bundle:
    url: https://github.com/redhat-developer-demos/rhd-tutorial-ui/releases/download/v0.1.10/ui-bundle.zip
    snapshot: true
  supplemental_files:
    - path: ./supplemental-ui
    - path: .nojekyll
    - path: ui.yml
      contents: "static_files: [ .nojekyll ]"

output:
  dir: ./gh-pages
